<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta charset="viewport" content="width=device-width, initial-scale=1.0">

    <title>O. Pulya - Socials</title>

    <style>

        /*Основні кольори*/

        :root {
            --bg: #f5f7fb;
            --card: rgba(255, 255, 255, 0.72);
            --text: #101116;
            --muted: #656975;
            --border: rgba(0, 0, 0, 0.08);

            --accent: #6d5dfc;
            --accent2: #00c2ff;

            --shadow:
                0 20px 60px rgba(20, 25, 40, 0.12);
        }

        /*Темна тема*/

        body.dark {
            --bg: #08090d;
            --card: rgba(20, 21, 29, 0.72);
            --text: #f7f7fb;
            --muted: #a4a7b3;
            --border: rgba(255, 255, 255, 0.09);

            --shadow:
                0 20px 70px rgba(0, 0, 0, 0.45);
        }

        /*Reset*/

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            main-height: 100vh;

            font-family: 
                Inter,
                system-ui,
                -apple-system, 
                BlincMacSystemFont,
                "Segoe UI",
                sans-serif;
            
            color: var(--text);
            background: var(--bg);

            overflow-x: hidden;

            transition: background 0.5s ease, color 0.5s ease;
        }

        /*Анімований фон*/

        .background {

        position: fixed;
        inset: 0;

        overflow: hidden;

        z-index: -2;

        background: 
            radial-gradient(circle at 20% 15%, rgba(109, 93, 252, 0.18), transparent 30%),
            
            radial-gradient(circle at 80% 80%, rgba(0, 194, 255, 0.14), transparent 30%);
        }

        .blob {
            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.45;

            animation: float 10s ease-in-out infinite alternate;
        }

        .blob.one {
            background: #765cff;
            
            left: -100px;
            top: 5%;
        }

        .blob.two {
            background: #00c2ff;

            right: -120px;
            bottom: 5%;

            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0), scale(1);
            }

            to {
                transform: translate(80px, -50px), scale(1.15);
            }
        }

        /*Контейнер*/

        .container {
            width: min(680px, 92%);

            margin: 0 auto;

            padding: 28px 0 50px;
        }

        /*Кнопка теми*/

        .top {
            display: flex;
            justify-content: flex-end;
        }

        .theme-button {
            width: 48px;
            height: 48px;

            border: 1px solid var(--border);

            border-radius: 16px;

            background: var(--card);

            color: var(--text);

            backdrop-filter: blur(16px);

            box-shadow: var(--shadow);

            cursor: pointer;

            font-size: 21px;

            transition: 0.3s;
        }

        .theme-button:hover {
            transform: 
            rotate(12deg)
            scale(1.08);
        }

        /*Header*/

        header {
            text-align: center;

            padding: 38px 0 25px;

            animation: appear 0.8s ease both;
        }

        /*Avatar*/

        .avatar {
            width: 105px;
            height: 105px;

            margin: 0 auto;

            border-radius: 50%;

            display: grid;
            place-items: center;

            color: white;

            font-size: 31px;

            font-weight: 800;

            letter-spacing: -2px;

            background: 
                linear-gradient(135deg, var(--accent), var(--accent2));

            box-shadow:
                0 0 0 8px
                rgba(109, 93, 252, 0.08),

                0 18px 50px
              rgba(109, 93, 252, 0.3);

            animation: avatarAnimation 4s ease-in-out infinite;
        }

        @keyframes avatarAnimation {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /*Name*/

        h1 {
            margin-top: 20px;

            font-size: 42px;

            letter-spacing: -2px;
        }

        /*Dscription*/

        .descriprtion {
            max-width: 500px;

            margin:
                8px auto
                0;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.55;
        }

        /*Link*/

        .links {
            display: grid;

            gap: 14px;
        }
    </style>
</head>
