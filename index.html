<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta charset="viewport" content="width=device-width, initial-scale=1.0">

    <title>O. Pulya - Socials</title>

    <style>

        /*Основні кольори*/

        :root {
            --bg: #f5f7fb;
            --card: rgba(255, 255, 255, 0.72);
            --text: #101116;
            --muted: #656975;
            --border: rgba(0, 0, 0, 0.08);

            --accent: #6d5dfc;
            --accent2: #00c2ff;

            --shadow:
                0 20px 60px rgba(20, 25, 40, 0.12);
        }

        /*Темна тема*/

        body.dark {
            --bg: #08090d;
            --card: rgba(20, 21, 29, 0.72);
            --text: #f7f7fb;
            --muted: #a4a7b3;
            --border: rgba(255, 255, 255, 0.09);

            --shadow:
                0 20px 70px rgba(0, 0, 0, 0.45);
        }

        /*Reset*/

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            main-height: 100vh;

            font-family: 
                Inter,
                system-ui,
                -apple-system, 
                BlincMacSystemFont,
                "Segoe UI",
                sans-serif;
            
            color: var(--text);
            background: var(--bg);

            overflow-x: hidden;

            transition: background 0.5s ease, color 0.5s ease;
        }

        /*Анімований фон*/

        .background {

        position: fixed;
        inset: 0;

        overflow: hidden;

        z-index: -2;

        background: 
            radial-gradient(circle at 20% 15%, rgba(109, 93, 252, 0.18), transparent 30%),
            
            radial-gradient(circle at 80% 80%, rgba(0, 194, 255, 0.14), transparent 30%);
        }

        .blob {
            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.45;

            animation: float 10s ease-in-out infinite alternate;
        }

        .blob.one {
            background: #765cff;
            
            left: -100px;
            top: 5%;
        }

        .blob.two {
            background: #00c2ff;

            right: -120px;
            bottom: 5%;

            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0), scale(1);
            }

            to {
                transform: translate(80px, -50px), scale(1.15);
            }
        }

        /*Контейнер*/

        .container {
            width: min(680px, 92%);

            margin: 0 auto;

            padding: 28px 0 50px;
        }

        /*Кнопка теми*/

        
    </style>
</head>
